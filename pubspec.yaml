name: miwodo
description: "Miwodo — Connectez-vous aux prestataires locaux de Lomé"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  firebase_auth: ^5.5.4
  firebase_app_check: ^0.3.2
  # firebase_storage: ^12.4.4  # Remplacé par API PHP/MySQL
  firebase_messaging: ^15.2.4
  http: ^1.6.0
  http_parser: ^4.0.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # UI
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.1.10
  shimmer: ^2.0.0

  # Paiement & Storage (API PHP/MySQL sur hébergement mutualisé)
  webview_flutter: ^4.12.0

  # Utilitaires
  image_picker: ^1.1.2
  intl: ^0.20.2
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Audio - désactivé temporairement pour le build (incompatibilité record_linux)
  # record: 5.1.0
  audioplayers: ^6.7.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Configuration des icônes d'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
