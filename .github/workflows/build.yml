name: Build APK and AAB (Release)

on:
  push:
    branches: [ main, master, update-v1.0.2 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Build APK (Release Universal)
        run: flutter build apk --release

      - name: Build App Bundle (AAB for Google Play)
        run: flutter build appbundle --release

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: miwodo-v1.0.2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB Release (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: miwodo-v1.0.2-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

