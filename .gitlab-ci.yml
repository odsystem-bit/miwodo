stages:
  - build

build_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:3.47.0
  before_script:
    - flutter pub get
  script:
    - flutter build apk --release --target-platform android-arm64
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 30 days
