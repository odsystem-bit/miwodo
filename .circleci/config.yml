version: 2.1

jobs:
  build:
    docker:
      - image: cirrusci/flutter:3.24.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: flutter pub get
      - run:
          name: Build APK
          command: flutter build apk --release --target-platform android-arm64
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
